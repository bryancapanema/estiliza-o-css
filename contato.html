<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato - TechInova</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <nav>
            <div id="logo">TechInova</div>
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="servicos.html">Serviços</a></li>
                <li><a href="contato.html">Contato</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h1>Fale Conosco</h1>
            <p>Preencha o formulário abaixo para entrar em contato com nossa equipe sobre dúvidas, orçamentos ou parcerias.</p>
        </section>

        <section>
            <form id="formulario-contato" action="#" method="get">
                <div class="campo-form">
                    <label for="nome">Nome Completo:</label>
                    <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>
                </div>

                <div class="campo-form">
                    <label for="email">E-mail de Contato:</label>
                    <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" required>
                </div>

                <div class="campo-form">
                    <label for="assunto">Assunto:</label>
                    <select id="assunto" name="assunto">
                        <option value="orcamento">Solicitar Orçamento</option>
                        <option value="duvida">Dúvidas Técnicas</option>
                        <option value="parceria">Proposta de Parceria</option>
                        <option value="outro">Outro Assunto</option>
                    </select>
                </div>

                <div class="campo-form">
                    <label for="mensagem">Mensagem:</label>
                    <textarea id="mensagem" name="mensagem" rows="5" placeholder="Escreva sua mensagem aqui..." required></textarea>
                </div>

                <button type="submit" class="btn">Enviar Mensagem</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 TechInova. Todos os direitos reservados.</p>
    </footer>

</body>
</html>
